<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mata Helang: Cari Kata</title>
    <meta
      name="description"
      content="Mata Helang: Cari Kata - seberapa tajam mata kamu?"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="screen">
      <section id="title-screen" class="panel active" aria-labelledby="game-title" aria-hidden="false">
        <p class="eyebrow">Permainan Kata</p>
        <h1 id="game-title">Mata Helang: Cari Kata</h1>
        <p class="tagline">Seberapa Tajam Mata Kamu?</p>

        <button id="start-button" type="button" aria-label="Mula permainan">
          MULA
        </button>

        <p class="version" aria-label="Versi permainan">v0.8.0</p>
      </section>

      <section id="age-screen" class="panel" aria-labelledby="age-title" aria-hidden="true">
        <p class="eyebrow">Permainan Kata</p>
        <h2 id="age-title">PILIH UMUR</h2>

        <div class="age-list" aria-label="Pilihan umur">
          <button class="age-button" data-age="5–7 Tahun" type="button">🐣 5–7 Tahun</button>
          <button class="age-button" data-age="8–10 Tahun" type="button">🧒 8–10 Tahun</button>
          <button class="age-button" data-age="11–12 Tahun" type="button">🎒 11–12 Tahun</button>
          <button class="age-button" data-age="13–15 Tahun" type="button">🧠 13–15 Tahun</button>
        </div>

        <button id="age-back-button" class="secondary-button" type="button">
          KEMBALI
        </button>
      </section>

      <section id="category-screen" class="panel" aria-labelledby="category-title" aria-hidden="true">
        <p class="eyebrow">Permainan Kata</p>
        <h2 id="category-title">PILIH KATEGORI</h2>
        <p id="selected-age-label" class="selected-age">Umur: --</p>
        <p id="category-message" class="category-message" aria-live="polite"></p>

        <div class="category-list" aria-label="Pilihan kategori">
          <button class="category-button" data-category="Haiwan" type="button">🐾 Haiwan</button>
          <button class="category-button" data-category="Buah-buahan" type="button">🍉 Buah-buahan</button>
          <button class="category-button" data-category="Makanan" type="button">🍔 Makanan</button>
          <button class="category-button" data-category="Sekolah" type="button">🏫 Sekolah</button>
          <button class="category-button" data-category="Kenderaan" type="button">🚗 Kenderaan</button>
          <button class="category-button" data-category="Alam" type="button">🌿 Alam</button>
        </div>

        <button id="category-back-button" class="secondary-button" type="button">
          KEMBALI
        </button>
      </section>

      <section id="game-screen" class="panel" aria-labelledby="game-heading" aria-hidden="true">
        <p class="eyebrow">Permainan Kata</p>
        <h2 id="game-heading">CARI KATA</h2>
        <p id="game-session-label" class="selected-age">Umur: --</p>
        <p id="game-feedback" class="game-feedback" aria-live="polite"></p>

        <div class="game-layout">
          <div id="word-grid" class="word-grid" aria-label="Papan permainan"></div>

          <div class="word-panel">
            <h3 class="word-list-title">Senarai Kata</h3>
            <ul id="word-list" class="word-list" aria-label="Senarai kata"></ul>
          </div>
        </div>

        <div id="victory-panel" class="victory-panel hidden" aria-live="polite">
          <h3>TAHNIAH!</h3>
          <p>Semua kata ditemui.</p>
          <p id="victory-summary" class="victory-summary">0/0 kata ditemui</p>
          <div class="victory-actions">
            <button id="play-again-button" class="primary-button" type="button">MAIN LAGI</button>
            <button id="menu-button" class="secondary-button" type="button">MENU</button>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
